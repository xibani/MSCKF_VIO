# config/vio.yaml — Etapa 13: el VIO completo, en vivo en la Pi o sobre una grabación

inicializacion:
  t_reposo_s: 2.0             # segundos QUIETO al arrancar: sesgo del giroscopio e inclinación
  sigma_gir_max_dps: 0.5      # si el giroscopio varía más, se movió: se vuelve a intentar
  error_norma_acc_max: 1.0    # | |a_media| - g | máximo [m/s²]

reposo:                       # ZUPT: si los puntos no se mueven, la velocidad es 0
  desplazamiento_max_px: 0.3  # mediana del movimiento de los puntos entre dos imágenes
  puntos_min: 10              # con menos puntos seguidos no se decide
  sigma_velocidad_m_s: 0.01   # confianza en "v = 0"

ejecucion:
  aviso_cada_s: 1.0           # cada cuánto se imprime el estado
  presupuesto_ms: 50.0        # tiempo disponible por imagen a 20 fps
  cola_imu_max: 4000          # muestras de IMU en espera entre los dos procesos (20 s a 200 Hz)
  timeout_imu_s: 15.0         # espera máxima a que arranque el proceso de la IMU

vista:                        # etapa 14: la imagen con sus pistas, para el visor de la tablet
  puerto: 5006                # UDP, distinto del de la pose (5005)
  cada_n_imagenes: 4          # 20 fps / 4 = 5 imágenes por segundo al visor
  calidad_jpeg: 70            # 0-100; si no cabe en un paquete UDP, se baja sola
  cola_pista: 10              # últimas posiciones de cada pista que se dibujan
  longitud_larga: 20          # a partir de esta longitud, la pista se dibuja en verde

prueba:                       # etapa 16: pruebas de trayectoria con datos reales (sin verdad)
  paso_min_m: 0.01            # el recorrido se suma a pasos de al menos 1 cm (fuera el temblor)
  recorrido_min_m: 0.5        # con menos recorrido, el error de cierre en % no significa nada
  cierre_bueno_pct: 2.0       # orientativo: verde por debajo
  cierre_regular_pct: 5.0     # amarillo hasta aquí; rojo por encima

control:                      # etapa 16: órdenes del visor web a pi_vio
  puerto: 5007                # UDP, solo en la propia Pi (127.0.0.1)