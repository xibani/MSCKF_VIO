# config/lightglue.yaml — Etapa 21: SuperPoint (detecta y describe puntos) + LightGlue (los empareja)
# Solo se usa en el PC: necesita PyTorch.

dispositivo: auto             # auto: tarjeta NVIDIA si PyTorch la ve, y si no el procesador; cpu; cuda

superpoint:
  max_puntos: 1024            # como mucho, los 1024 puntos más llamativos de cada imagen
  umbral_deteccion: 0.0005    # puntuación mínima de un punto (de 0 a 1); el valor de sus autores
  radio_nms_px: 4             # dos puntos no pueden estar a menos de 4 px (se queda el mejor)

lightglue:
  umbral_confianza: 0.1       # una pareja con menos confianza (de 0 a 1) se descarta
  parada_temprana: 0.95       # si está así de segura a mitad de camino, termina antes (-1: nunca)
  poda_puntos: 0.99           # deja de mirar puntos que seguro no tienen pareja (-1: nunca)

evaluacion:                   # solo con imágenes del simulador, donde se sabe la verdad
  umbral_correcta_px: 3.0     # una pareja es correcta si el error es menor que esto
  instantes_s: [4.0, 4.5]     # los dos instantes de la trayectoria que se comparan por defecto

# ---------------------------------------------------------------------
# Etapa 22 — De parejas a pistas (vio/frontend_lightglue.py)
# ---------------------------------------------------------------------
pistas:
  umbral_confianza: 0.5       # una pareja con menos confianza no continúa una pista (valor de partida)
  margen_borde_px: 10         # no se empiezan pistas a menos de esto del borde
  celdas_x: 8                 # reparto de las pistas nuevas: los mismos valores que FAST (frontend.yaml)
  celdas_y: 6
  max_por_celda: 3            # como mucho 3 pistas nuevas por celda
  max_puntos: 150             # pistas vivas a la vez, en total
  distancia_min_px: 15        # una pista nueva no empieza más cerca de otro punto seguido

geometria:                    # el RANSAC de la etapa 8, con el umbral adaptado a SuperPoint
  metodo: esencial            # esencial: matriz esencial (etapa 8); giro: con el giroscopio (etapa 23)
  umbral_px: 2.0              # SuperPoint da píxeles enteros: más margen que el 1.0 de Lucas-Kanade
  confianza: 0.999
  paralaje_min_px: 1.0
  puntos_min: 8


# ---------------------------------------------------------------------
# Etapa 23 — Rechazo geométrico con el giro del giroscopio (RANSAC de 2 puntos)
# ---------------------------------------------------------------------
giro:
  umbral_px: 2.0              # distancia máxima de un punto a su recta epipolar (como en geometria)
  paralaje_min_px: 1.0        # si, quitado el giro, la mediana de lo que queda es menor, no se busca traslación
  iteraciones: 100            # pruebas del RANSAC (con 2 parejas por prueba bastan pocas)
  semilla: 0                  # del azar del RANSAC: la misma grabación da siempre el mismo resultado