# config/calibracion.yaml — Parámetros de los procedimientos de calibración (etapa 7)
# (Los RESULTADOS se guardan aparte: config/camara_intrinsecos.yaml, config/imu_calibracion.yaml)

tablero:
  esquinas_x: 9            # esquinas INTERIORES en horizontal (un tablero de 10 x 7 cuadros)
  esquinas_y: 6            # esquinas interiores en vertical
  lado_m: 0.025            # lado de un cuadro, MEDIDO con regla sobre el papel impreso [m]

aprilgrid:                 # etapa 7.4: plantilla de Kalibr (datos/kalibr/target.pdf), tags AprilTag 36h11
  tags_x: 6                # tags en horizontal
  tags_y: 6                # tags en vertical
  lado_tag_m: 0.024        # lado del cuadrado negro de un tag, MEDIDO en el papel [m]
                           # (6 tags + 5 huecos de una fila = 7,5 lados: mide la fila y divide)
  espacio_relativo: 0.3    # hueco entre tags / lado del tag (0,72 / 2,4 cm en el PDF)
  bits_borde: 2            # Kalibr dibuja los tags con un borde negro de 2 celdas
  tags_min: 4              # con menos tags a la vista la imagen no se usa

camara:
  imagenes_objetivo: 30    # imágenes a capturar
  zonas_cobertura: 3       # la imagen se divide en 3 x 3 zonas para medir la cobertura
  nitidez_min: 100.0       # varianza del laplaciano por debajo de esto: imagen movida
  rms_objetivo_px: 0.3     # error de reproyección objetivo
  rms_max_px: 0.5          # por encima, la calibración no vale
  factor_descarte: 2.0     # se descartan imágenes con error > factor · mediana

acelerometro:
  t_asentar_s: 1.0         # tras pulsar Enter, segundos que se descartan (soltar la mano)
  t_por_posicion_s: 5.0    # segundos quietos en cada una de las 6 posiciones
  sigma_gir_max_dps: 0.5   # si el giroscopio se mueve más, se repite la posición
  coseno_min: 0.98         # el eje esperado debe estar a menos de ~11° de la vertical

allan:                     # etapa 7.3: ruido de la IMU por varianza de Allan
  descartar_inicio_s: 120  # se tira el principio: la placa aún se asienta y se calienta
  duracion_min_s: 3600     # por debajo se avisa: el paseo del sesgo no llegará a verse
  puntos_por_decada: 10    # resolución en τ de la curva
  fraccion_tau_max: 0.1    # τ máximo = T/10: con menos de ~10 clusters σ sale con mucho error
  tau_ruido_blanco_s: [0.1, 1.0]   # tramo de la recta -1/2 (por debajo de 0,1 s influye el DLPF)
  pendiente_paseo_min: 0.3 # tramo del paseo: pendiente local por encima de esto (recta +1/2)
  perdidas_max_pct: 1.0    # más muestras perdidas: grabación NO válida (¿otro programa leyendo la IMU?)
  caida_joroba: 2.0        # la curva sube y vuelve a bajar este factor: perturbación periódica
  bloque_periodo_s: 1.0    # medias de 1 s antes de buscar el periodo en el espectro
  periodo_min_s: 20.0      # periodos más cortos no se buscan (no forman joroba a la derecha)
  factor_filtro: 2.0       # ruido para el MSCKF = medido × esto (en reposo sale optimista)
  factor_kalibr: 10.0      # el wiki de Kalibr recomienda ~×10 en IMU MEMS baratas
  referencia_ruido_gir: 8.7e-5   # hoja de datos de la MPU-6050 [rad/s/√Hz], para comparar
  referencia_ruido_acc: 3.9e-3   # hoja de datos [m/s²/√Hz] (400 µg/√Hz)

camara_imu:                # etapa 7.4: giro cámara-IMU (R_i_c) y desfase t_d con el giroscopio
  objetivo: aprilgrid      # tablero de las grabaciones: "aprilgrid" (Kalibr) o "tablero" (ajedrez, 7.1)
  nitidez_min: 30.0        # imágenes más movidas se descartan (en movimiento baja de 100)
  reproyeccion_max_px: 1.5 # postura del tablero con más error que esto: imagen descartada
  hueco_max_s: 0.08        # imágenes válidas más separadas no dan velocidad (a 20 fps: 0,05 s)
  velocidad_max_dps: 400.0 # intervalos más rápidos: salto falso (tablero detectado al revés)
  desfase_max_ms: 100.0    # t_d se busca entre -100 y +100 ms
  paso_grueso_ms: 1.0      # paso del primer barrido
  paso_fino_ms: 0.05       # paso del segundo barrido, alrededor del mejor
  margen_fino_ms: 2.0      # el segundo barrido cubre ±2 ms alrededor del mejor
  factor_descarte: 3.0     # intervalos con residuo > 3 × la mediana: fuera, y se repite
  intervalos_min: 300      # con menos intervalos buenos la grabación no vale (≈ 15 s útiles)
  excitacion_min_dps: 15.0 # desviación típica mínima de la velocidad de giro en CADA eje
  residuo_max_dps: 5.0     # residuo RMS final mayor: algo no cuadra (aviso)
  angulo_max_regla_deg: 10.0     # más diferencia con la R_i_c de regla: ejes o tablero mal
  dispersion_td_max_ms: 1.0      # varias grabaciones: desviación típica máxima de t_d
  dispersion_R_max_deg: 0.3      # varias grabaciones: separación máxima de la R media